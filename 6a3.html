<!DOCTYPE html>
<html>
    
    <head>
        <style>
    .getstartedbutton {
        background-color: rgb(121, 82, 179);
        color: white;
        border: none;
        border-radius: 6px;
        width: 150px;
        height: 36px;
        cursor:pointer;
    }
    .getstartedbutton:hover{
        background-color: rgb(188, 11, 152);
        color:white;
        border-color: rgb(154, 8, 154);
        border-style: solid;
        border-width: 1px;
    }

    .downloadbutton {
        background-color: rgb(254, 254, 255);
        color: grey;
        border-color: grey;
        border-style: solid;
        border-radius: 6px;
        width: 150px;
        height: 36px;
        cursor:pointer;
    }
    .downloadbutton:hover{
        color:black;
        border-color: black;
    }
</style>
    </head>


    <body>
        <button class="getstartedbutton"> Get Started </button>
        <button class="downloadbutton"> Download </button>
    </body>


</html>
